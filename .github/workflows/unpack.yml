name: Unpack project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          unzip -q MoonZoom_phase4.zip -d /tmp/p
          rm -rf /tmp/p/MoonZoom/.github
          cp -r /tmp/p/MoonZoom/. .
          rm MoonZoom_phase4.zip
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Moon Zoom project"
          git push
